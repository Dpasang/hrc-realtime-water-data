name: Daily HRC realtime water archive

on:
  schedule:
    - cron: '0 9 * * *' # UTC 09:00 = Asia/Shanghai 17:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hrc-daily-water-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Test archive safeguards
        run: python -m unittest discover -s tests -v
      - name: Collect current official table
        id: collect
        continue-on-error: true
        run: python collector.py
      - name: Rebuild monthly and latest views
        if: always()
        run: python archive.py
      - name: Commit evidence and derived views
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data snapshots latest status history
          if git diff --cached --quiet; then
            echo "No output changes."
            exit 0
          fi
          git commit -m "Archive HRC water snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save downloadable evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hrc-realtime-water-${{ github.run_id }}
          path: |
            data/latest/
            latest/
            status/
            data/**/月统计.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Report incomplete collection as failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Collection failed. Existing latest data was preserved; see status/latest_attempt.json.'
          exit 1

